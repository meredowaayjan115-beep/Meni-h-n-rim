    let currentQuestionIndex = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0 };

    const progressText = document.getElementById("progress-text");
    const questionText = document.getElementById("question-text");
    const answersContainer = document.getElementById("answers-container");

    function loadQuestion() {
        if (currentQuestionIndex < questions.length) {
            let q = questions[currentQuestionIndex];
            progressText.innerText = `Sorag ${currentQuestionIndex + 1} / ${questions.length}`;
            questionText.innerText = q.question;
            answersContainer.innerHTML = "";

            q.answers.forEach(ans => {
                let button = document.createElement("button");
                button.innerText = ans.text;
                button.classList.add("btn");
                button.onclick = () => selectAnswer(ans.category);
                answersContainer.appendChild(button);
            });
        } else {
            showResult();
        }
    }

    function selectAnswer(category) {
        scores[category]++;
        currentQuestionIndex++;
        loadQuestion();
    }

    function showResult() {
        let bestCategory = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        
        let categoryName = "";
        let recommendedJobs = "";

        if (bestCategory === "A") {
            categoryName = "IT, Inženerçilik we Takyk tehnologiýalar";

</script>
